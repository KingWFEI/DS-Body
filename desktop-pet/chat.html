<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小鲸娘对话</title>
    <link rel="stylesheet" href="/src/chat.css" />
  </head>
  <body>
    <main class="chat-window">
      <header class="chat-header">
        <div class="avatar" aria-hidden="true">🐳</div>
        <div class="header-meta">
          <h1>小鲸娘</h1>
          <p id="connectionStatus" class="status-badge status-checking">正在检测智能体连接…</p>
        </div>
        <button id="clearBtn" class="clear-btn" type="button" title="清空当前对话记录">清空</button>
      </header>

      <section id="messages" class="messages" aria-label="对话内容" aria-live="polite"></section>

      <form id="chatForm" class="composer" aria-label="消息输入区">
        <input
          id="messageInput"
          type="text"
          maxlength="2000"
          placeholder="输入消息和小鲸娘聊天吧…（Enter 发送）"
          autocomplete="off"
        />
        <button id="sendBtn" type="submit" aria-label="发送消息" title="发送">➤</button>
      </form>
    </main>
    <script type="module" src="/src/chat.js"></script>
  </body>
</html>
