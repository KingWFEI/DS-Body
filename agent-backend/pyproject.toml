[project]
name = "ds-body-agent-backend"
version = "0.1.0"
description = "Backend intelligent agent service for DS-Body desktop pet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.22.1",
  "fastapi>=0.115.0",
  "faster-whisper>=1.2.1",
  "httpx>=0.27.0",
  "langchain-core>=1.8.4",
  "langchain-openai>=1.8.5",
  "langgraph>=1.2.24",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "numpy>=2.4.6",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.34",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

